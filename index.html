<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">

<title>قرمشة | المنيو</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Aref+Ruqaa:wght@700&family=El+Messiri:wght@500;700&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FFFFFF; --surface:#FFFFFF; --text:#2B1B12; --muted:#8A7461;
  --accent:#8B2E2E; --accent2:#B9822E; --border:#ECE1CC; --chipbg:#F7F0E2;
}
*{box-sizing:border-box}
html,body{height:100%}
html{scroll-padding-top:130px}
body{
  margin:0;background:var(--bg);color:var(--text);
  font-family:'Tajawal',sans-serif;
  padding-top:env(safe-area-inset-top,0);
  padding-bottom:env(safe-area-inset-bottom,0);
}
header{
  position:sticky;top:0;z-index:5;background:var(--bg);
  padding:calc(14px + env(safe-area-inset-top,0)) 16px 10px;
  border-bottom:1px dashed var(--border);
}
.brand{display:flex;align-items:center;gap:8px}
.bean{width:24px;height:24px;flex:0 0 auto;fill:var(--accent)}
h1{font-family:'Aref Ruqaa',serif;font-weight:700;font-size:32px;margin:0;color:var(--accent);line-height:1}
.sub{color:var(--muted);font-size:12.5px;margin:6px 0 12px}
.searchwrap{position:relative}
#q{
  width:100%;padding:12px 40px 12px 14px;border-radius:12px;border:1px solid var(--border);
  background:var(--surface);color:var(--text);font-family:inherit;font-size:16px;
}
#q:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
#clear{
  position:absolute;left:8px;top:50%;transform:translateY(-50%);
  background:none;border:none;color:var(--muted);font-size:20px;cursor:pointer;
  display:none;padding:6px;line-height:1;
}
#clear:focus-visible{outline:2px solid var(--accent)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:12px 0 2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{
  flex:0 0 auto;padding:7px 14px;border-radius:999px;background:var(--chipbg);
  color:var(--text);font-size:13.5px;font-weight:500;border:1px solid transparent;
  cursor:pointer;white-space:nowrap;font-family:inherit;
}
.chip.active{background:var(--accent);color:#fff}
.chip:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
main{max-width:760px;margin:0 auto;padding:8px 16px 40px}
.section{scroll-margin-top:136px;margin-top:22px}
.section h2{
  font-family:'El Messiri',serif;font-size:17px;margin:0 0 8px;
  display:flex;align-items:baseline;gap:8px;
}
.section h2 small{color:var(--muted);font-weight:400;font-size:12.5px}
.list{border:1px solid var(--border);border-radius:14px;overflow:hidden}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 14px;border-bottom:1px solid var(--border);min-height:52px}
.row:last-child{border-bottom:none}
.name{font-weight:500;font-size:14.5px;line-height:1.35}
.price{text-align:left;flex:0 0 auto}
.amt{font-weight:700;color:var(--accent2);font-size:14.5px;white-space:nowrap}
.amt.na{font-size:12px;font-weight:500;color:var(--muted)}
.unit{color:var(--muted);font-size:11px}
#count{color:var(--muted);font-size:12.5px;margin:0 0 8px}
#empty{display:none;text-align:center;color:var(--muted);padding:40px 10px;font-size:14px}
@media(min-width:640px){
  .list{display:grid;grid-template-columns:1fr 1fr}
  .row{border-inline-start:1px solid var(--border)}
  .row:nth-child(odd){border-inline-start:none}
}
@media(prefers-reduced-motion:no-preference){html{scroll-behavior:smooth}}
</style>
</head>

function norm(s){
  return s.replace(/[\u064B-\u0652]/g,'').replace(/[إأآا]/g,'ا')
    .replace(/ى/g,'ي').replace(/ة/g,'ه').replace(/[ؤئ]/g,'ي').trim().toLowerCase();
}
function fmtPrice(p){return p===0?'<span class="amt na">عند الطلب</span>':'<span class="amt">'+p+' ج.م</span>';}
function unitLabel(u){return u===0?'للقطعة':'للكيلو';}
function rowHTML(item){
  const [name,price,unit]=item;
  return '<div class="row"><div class="name">'+name+'</div><div class="price">'+fmtPrice(price)+
    '<div class="unit">'+unitLabel(unit)+'</div></div></div>';
}

const menuEl=document.getElementById('menu');
CATS.forEach((cat,ci)=>{
  const items=DATA.filter(d=>d[3]===ci);
  const sec=document.createElement('div');
  sec.className='section';sec.id='cat-'+ci;
  sec.innerHTML='<h2>'+cat+' <small>('+items.length+')</small></h2><div class="list">'+
    items.map(rowHTML).join('')+'</div>';
  menuEl.appendChild(sec);
});

const chipsEl=document.getElementById('chips');
chipsEl.innerHTML='<button class="chip active" data-t="top">الكل</button>'+
  CATS.map((c,i)=>'<button class="chip" data-t="cat-'+i+'">'+c+'</button>').join('');
chipsEl.addEventListener('click',e=>{
  const b=e.target.closest('.chip');if(!b)return;
  const t=b.dataset.t;
  if(t==='top'){window.scrollTo({top:0,behavior:'smooth'});}
  else{document.getElementById(t).scrollIntoView({behavior:'smooth',block:'start'});}
});
const chipButtons=[...chipsEl.children];
const sections=[...document.querySelectorAll('.section')];
if('IntersectionObserver' in window){
  const io=new IntersectionObserver(entries=>{
    entries.forEach(en=>{
      if(en.isIntersecting){
        const idx=sections.indexOf(en.target);
        chipButtons.forEach(b=>b.classList.remove('active'));
        (chipButtons[idx+1]||chipButtons[0]).classList.add('active');
      }
    });
  },{rootMargin:'-120px 0px -70% 0px'});
  sections.forEach(s=>io.observe(s));
}

const q=document.getElementById('q'),clearBtn=document.getElementById('clear');
const resultsWrap=document.getElementById('results'),resultsList=document.getElementById('resultsList');
const countEl=document.getElementById('count'),emptyEl=document.getElementById('empty');

function runSearch(){
  const raw=q.value.trim();
  clearBtn.style.display=raw?'block':'none';
  if(!raw){resultsWrap.style.display='none';menuEl.style.display='block';chipsEl.style.display='flex';return;}
  chipsEl.style.display='none';menuEl.style.display='none';resultsWrap.style.display='block';
  const nq=norm(raw);
  const found=DATA.filter(d=>norm(d[0]).includes(nq));
  countEl.textContent=found.length+' نتيجة';
  resultsList.innerHTML=found.map(rowHTML).join('');
  emptyEl.style.display=found.length?'none':'block';
  resultsList.style.display=found.length?'':'none';
}
q.addEventListener('input',runSearch);
clearBtn.addEventListener('click',()=>{q.value='';runSearch();q.focus();});
resultsWrap.style.display='none';
